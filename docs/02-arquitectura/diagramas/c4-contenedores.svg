<text x="980.0" y="98" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[Persona · sin INT]</text>
<text x="980.0" y="114" font-size="11" fill="#fff" text-anchor="middle">Lee reportes.</text>
<rect x="30" y="200" width="1000" height="760" rx="6" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="44" y="222" font-size="14" font-weight="bold" fill="#444">ROYEXA [Sistema de software]</text>
<rect x="60" y="250" width="300" height="140" rx="8" fill="#438dd5"/>
<text x="210.0" y="274" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Aplicación móvil del cobrador</text>
<text x="210.0" y="292" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[CON-01 · React Native + TypeScript,</text>
<text x="210.0" y="305" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">SQLCipher]</text>
<text x="210.0" y="321" font-size="11" fill="#fff" text-anchor="middle">Cola local cifrada de cobros y gastos sin</text>
<text x="210.0" y="335" font-size="11" fill="#fff" text-anchor="middle">señal; sincroniza al volver la señal.</text>
<rect x="640" y="250" width="320" height="140" rx="8" fill="#438dd5"/>
<text x="800.0" y="274" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Aplicación web de administración</text>
<text x="800.0" y="292" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[CON-02 · React 19 + Vite, SPA estática]</text>
<text x="800.0" y="308" font-size="11" fill="#fff" text-anchor="middle">Aprobaciones, clientes, caja, descuadres y</text>
<text x="800.0" y="322" font-size="11" fill="#fff" text-anchor="middle">tablero.</text>
<rect x="330" y="480" width="440" height="150" rx="8" fill="#438dd5"/>
<text x="550.0" y="504" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">API del servidor</text>
<text x="550.0" y="522" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[CON-03 · Python 3.14, FastAPI, SQLAlchemy 2, ECS Fargate]</text>
<text x="550.0" y="538" font-size="11" fill="#fff" text-anchor="middle">Monolito modular: valida reglas, calcula dinero en centavos,</text>
<text x="550.0" y="552" font-size="11" fill="#fff" text-anchor="middle">escribe el libro mayor y publica eventos.</text>
