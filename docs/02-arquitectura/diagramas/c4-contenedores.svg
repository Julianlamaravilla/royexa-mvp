<text x="1165.0" y="508" font-size="11" fill="#fff" text-anchor="middle">Avisos push.</text>
<rect x="1060" y="600" width="210" height="110" rx="8" fill="#999999"/>
<text x="1165.0" y="624" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Telegram Bot API</text>
<text x="1165.0" y="642" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[EXT-03 · Sistema externo]</text>
<text x="1165.0" y="658" font-size="11" fill="#fff" text-anchor="middle">Reportes y alertas.</text>
<rect x="1060" y="750" width="210" height="110" rx="8" fill="#999999"/>
<text x="1165.0" y="774" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Captura de errores</text>
<text x="1165.0" y="792" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[EXT-04 · Sistema externo]</text>
<text x="1165.0" y="808" font-size="11" fill="#fff" text-anchor="middle">Errores sin datos personales.</text>
