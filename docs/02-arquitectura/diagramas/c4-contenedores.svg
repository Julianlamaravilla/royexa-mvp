<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 990" width="1300" height="990" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">C4 de Contenedores de ROYEXA</title><desc id="d">La app móvil y la web consumen la API del servidor; la API usa PostgreSQL y S3 y envía alertas a SES, FCM, Telegram y captura de errores.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
