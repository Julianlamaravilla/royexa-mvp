<text x="660.0" y="98" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[Persona · INT-02]</text>
<text x="660.0" y="114" font-size="11" fill="#fff" text-anchor="middle">Aprueba y verifica.</text>
