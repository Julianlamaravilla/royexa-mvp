<text x="760.0" y="828" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[CON-05 · Amazon S3]</text>
<text x="760.0" y="844" font-size="11" fill="#fff" text-anchor="middle">Fotos de identidad y comprobantes con hash.</text>
<rect x="1060" y="300" width="210" height="110" rx="8" fill="#999999"/>
