<text x="310.0" y="828" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[CON-04 · PostgreSQL 17+ (RDS)]</text>
<text x="310.0" y="844" font-size="11" fill="#fff" text-anchor="middle">Libro mayor de solo inserción, préstamos,</text>
<text x="310.0" y="858" font-size="11" fill="#fff" text-anchor="middle">cajas, sincronización y cola de eventos.</text>
<path d="M600 784v102a160.0 14 0 0 0 320 0v-102a160.0 14 0 0 0 -320 0a160.0 14 0 0 0 320 0" fill="#438dd5"/>
