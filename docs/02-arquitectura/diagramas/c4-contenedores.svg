<text x="190.0" y="98" font-size="10.5" fill="#fff" fill-opacity=".9" text-anchor="middle">[Persona · INT-01]</text>
<text x="190.0" y="114" font-size="11" fill="#fff" text-anchor="middle">Cobra y cierra caja.</text>
