{% extends "base.html" %}
{% block title %}Administrador · ROYEXA{% endblock %}
{% block body %}
<header class="bar">
  <div><strong>{{ user.name }}</strong></div>
  <form method="post" action="/web/logout">
    <input type="hidden" name="ficha" value="{{ logout_token }}">
    <button type="submit" class="link">Salir</button>
  </form>
</header>
<main>
  <h1>Administrador</h1>
  <ul class="list">
    <li><a class="button" href="/web/admin/solicitudes">Solicitudes en espera ({{ waiting }})</a></li>
    <li><a class="button" href="/web/admin/libro">Libro</a></li>
    <li><a class="button" href="/web/admin/clientes">Clientes</a></li>
    <li><a class="button" href="/web/admin/descuadres">Descuadres del periodo</a></li>
    <li><a class="button" href="/web/admin/cajas">Cajas cerradas</a></li>
  </ul>
</main>
{% endblock %}
