{% extends "base.html" %}
{% block title %}Ingresar · ROYEXA{% endblock %}
{% block body %}
<main class="narrow">
  <h1>ROYEXA</h1>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/web/login" class="stack">
    <label>Usuario
      <input name="user_id" value="{{ user_id }}" autocomplete="username" autocapitalize="none" required>
    </label>
    <label>Contraseña
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="primary">Ingresar</button>
  </form>
</main>
{% endblock %}
