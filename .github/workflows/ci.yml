name: CI

on:
  pull_request:
    branches: [mvp]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: royexa
          POSTGRES_USER: royexa_migrator
          POSTGRES_PASSWORD: royexa_migrator
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U royexa_migrator -d royexa"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv sync --locked
      - name: Install Chromium for the end-to-end test (T7d)
        run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m ""
        env:
          ROYEXA_REQUIRE_E2E: "1"
      - name: Build the production image and start it as production does (T10b2)
        run: |
          docker build -t royexa:ci .
          docker run -d --name royexa --network host \
            -e PORT=8001 -e ROYEXA_SEED=pilot -e ROYEXA_REQUIRE_CHANGED_PASSWORDS=1 \
            -e ROYEXA_DISPATCH_SECONDS=0 -e ROYEXA_APP_PASSWORD=ci-only-password-0123456789 \
            -e ROYEXA_MIGRATOR_URL=postgresql://royexa_migrator:royexa_migrator@127.0.0.1:55432/royexa \
            -e ROYEXA_LEDGER_URL=postgresql://royexa_app:ci-only-password-0123456789@127.0.0.1:55432/royexa \
            royexa:ci
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:8001/health && exit 0
            sleep 2
          done
          docker logs royexa
          exit 1
